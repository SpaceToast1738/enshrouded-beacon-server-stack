# Enshrouded dedicated server + beacon companion + watchtower
# auto-update, all wired up for a single Ubuntu host. Data
# forwards over HTTPS to a separate dashboard host (your existing
# enshrouded-beacon deployment) via the `beacon` service.
#
# Quickstart:
#   cp .env.example .env
#   $EDITOR .env       # fill in DASHBOARD_URL, ESB_TOKEN, SERVER_*
#   docker compose up -d
#   docker compose logs -f beacon       # watch first post land
#
# Architecture: see README.md.

services:

  # ─────────────────────────────────────────────────────────────
  # Enshrouded dedicated server
  # Wine-based community image. The server's Windows binary +
  # SteamCMD live INSIDE the container; the host doesn't need
  # Wine installed.
  #
  # Pin to a specific image tag rather than `:latest` for the
  # dedicated server — game patches sometimes break the Wine
  # layer for a day or two. Tag-pinning gives you a known-good
  # baseline; bump manually after smoke-testing.
  #
  # Community-image docs: https://github.com/jsknnr/enshrouded-server
  # ─────────────────────────────────────────────────────────────
  enshrouded-server:
    image: sknnr/enshrouded-dedicated-server:latest
    container_name: enshrouded-server
    restart: unless-stopped
    ports:
      # UDP, all three needed for gameplay + Steam server-list
      # discovery. Open these on the host's firewall too (see
      # docs/port-forwarding.md).
      - "${GAME_PORT:-15636}:15636/udp"
      - "${QUERY_PORT:-15637}:15637/udp"
      - "15638:15638/udp"
    volumes:
      # All persistent server state lives under ./data/enshrouded.
      # The community image expects /home/steam/enshrouded as its
      # working tree (savegame/, logs/, enshrouded_server.json,
      # enshrouded_server_NNN.dat files all land here).
      - ./data/enshrouded:/home/steam/enshrouded
      # 0.44.4 ATTEMPT REVERTED in 0.44.5: tried to bind-mount
      # `enshrouded-install` named volume at
      # `/home/steam/Steam/steamapps/common/EnshroudedServer/`.
      # The sknnr image creates that directory as an EMPTY STUB
      # — SteamCMD's `force_install_dir` actually targets
      # `/home/steam/enshrouded/`, which we already bind-mount
      # from `./data/enshrouded/` (the line above). So the
      # named volume captured nothing. 0.44.5 drops the
      # named-volume mount and exposes the install dir to the
      # beacon via a sibling read-only bind mount on the
      # beacon's side instead (see beacon service below).
    environment:
      # Operator config — passed to the community image's
      # entrypoint which writes them into enshrouded_server.json
      # on first boot. Source values come from .env.
      - SERVER_NAME=${SERVER_NAME:-Enshrouded Server}
      - SERVER_PASSWORD=${SERVER_PASSWORD:-}
      - SERVER_SLOTS=${SERVER_SLOTS:-16}
      - GAME_PORT=15636
      - QUERY_PORT=15637
    # If your kernel allows, give the server a hint about which
    # CPUs to use. Default = all. Override via .env if you want
    # to reserve a core for other services.
    # cpuset: "0-3"

  # ─────────────────────────────────────────────────────────────
  # Beacon companion
  # Reads the dedicated server's save dir + logs (READ-ONLY)
  # plus a small writable volume for its log-tail-position
  # sidecar. Posts every 30s to your dashboard via HTTPS.
  #
  # Image is published by the source monorepo's CI:
  #   ghcr.io/spacetoast1738/enshrouded-beacon-server
  # Source: github.com/spacetoast1738/enshrouded-beacon
  # ─────────────────────────────────────────────────────────────
  beacon:
    image: ghcr.io/spacetoast1738/enshrouded-beacon-server:latest
    container_name: enshrouded-beacon
    restart: unless-stopped
    depends_on:
      - enshrouded-server
    volumes:
      # Save dir READ-ONLY — the beacon never modifies the
      # server's files.
      - ./data/enshrouded/savegame:/save:ro
      # Logs dir READ-ONLY for the same reason. The beacon
      # parses the log but never writes to it.
      - ./data/enshrouded/logs:/logs:ro
      # 0.44.3+: explicit bind-mount for the dedicated-server
      # config file (`enshrouded_server.json`). The parent-walk
      # auto-detect can't reach it because in the container the
      # parent of `/save` is just `/`, not the host's
      # `./data/enshrouded/`. With this file bind-mount plus
      # ESB_SERVER_CONFIG_PATH below, the beacon's routine
      # telemetry + diagnostic bundles both pick it up.
      - ./data/enshrouded/enshrouded_server.json:/config/enshrouded_server.json:ro
      # Small writable volume for the beacon's saved-position
      # sidecar (so docker restart doesn't re-process the whole
      # log). 0.43.1+ uses the ESB_LOG_POS_PATH env to put this
      # OUTSIDE the read-only logs mount.
      - ./data/beacon-state:/state:rw
      # 0.44.5+: READ-ONLY view of the dedicated server's install
      # dir so the beacon can include the small catalog files
      # (enshrouded_server.kfc, readme, steam_appid.txt) in
      # diagnostic bundles per the source repo's
      # `client/dedicated_diagnostic_bundle.py::_INSTALL_DAT_ALLOWLIST`.
      # Same host path as `./data/enshrouded:/home/steam/enshrouded`
      # on the server container, but mounted read-only here.
      # The big content `.dat` files + `.kfc_resources` are
      # listed in the bundle's manifest but NOT included in
      # the tarball (each exceeds the 10 MB bundle cap).
      # The beacon NEVER writes to this mount.
      - ./data/enshrouded:/install:ro
    environment:
      - ESB_SAVE_DIR=/save
      - ESB_LOG_PATH=/logs/enshrouded_server.log
      - ESB_LOG_POS_PATH=/state/tail-pos.json
      # 0.44.3+: explicit pointer to the config file mount above.
      - ESB_SERVER_CONFIG_PATH=/config/enshrouded_server.json
      # Forward target — your existing dashboard host.
      - ESB_SERVER_URL=${DASHBOARD_URL}
      - ESB_TOKEN=${ESB_TOKEN}
      # Optional: display name shown in /admin → Dedicated
      # servers. Defaults to SERVER_NAME so the two stay in
      # sync without operator action.
      - ESB_DISPLAY_NAME=${SERVER_NAME:-Enshrouded Server}
      # 0.44.0+: opt-in for the dashboard's "Request diagnostic
      # bundle" flow. Default off (operator must explicitly
      # set ESB_ALLOW_DIAGNOSTIC_BUNDLES=1 in .env). See
      # `.env.example` for the full privacy note + what's in
      # a bundle.
      - ESB_ALLOW_DIAGNOSTIC_BUNDLES=${ESB_ALLOW_DIAGNOSTIC_BUNDLES:-0}
      # Optional cadences (defaults shown):
      # - ESB_POLL_INTERVAL_SEC=30
      # - ESB_HEARTBEAT_INTERVAL_SEC=300

  # ─────────────────────────────────────────────────────────────
  # Watchtower
  # Auto-updates the `enshrouded-server` + `beacon` images by
  # polling :latest tags every 5 minutes. Comment out this
  # service if you'd rather pin image tags + upgrade manually.
  #
  # `--cleanup` removes old image layers post-pull (saves disk).
  # `--label-enable` would let you opt specific containers in;
  # we don't use it here so both auto-update.
  #
  # NOTE on image choice (2026-05-15+): we use `nickfedor/watchtower`
  # — the maintained fork of `containrrr/watchtower`. The original
  # `containrrr/watchtower:latest` bundles an old Docker API client
  # (1.25) that fails against any host running Docker Engine 25+
  # with:
  #   client version 1.25 is too old. Minimum supported API
  #   version is 1.44
  # The fork ships a current docker client lib + active maintenance.
  # Operators upgrading from the previous compose file just:
  #   docker compose pull watchtower
  #   docker compose up -d watchtower
  # ─────────────────────────────────────────────────────────────
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: enshrouded-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup
    environment:
      - TZ=${TZ:-UTC}

# No top-level networks block — services share Docker's default
# `bridge` network for the compose project, which is fine for the
# beacon → dashboard (HTTPS, leaves the host) + game-server →
# Steam (UDP, leaves the host) traffic.

# 0.44.5: the `enshrouded-install` named volume from 0.44.4
# is removed — it was mounted on the wrong path (sknnr image
# installs to `/home/steam/enshrouded`, NOT
# `.../Steam/steamapps/common/EnshroudedServer/`). The
# beacon's `/install:ro` mount now reads from the same host
# path as the server's main volume.
#
# Operators upgrading from 0.44.4: after `docker compose up
# -d`, you may have an orphan `enshrouded-install` named
# volume. Clean up with `docker volume rm enshrouded-beacon-
# server-stack_enshrouded-install` (the project prefix
# matches the directory name).
