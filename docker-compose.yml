# Enshrouded dedicated server + beacon companion + watchtower
# auto-update, all wired up for a single Ubuntu host. Data
# forwards over HTTPS to a separate dashboard host (your existing
# enshrouded-beacon deployment) via the `beacon` service.
#
# Quickstart:
#   cp .env.example .env
#   $EDITOR .env       # fill in DASHBOARD_URL, ESB_TOKEN, SERVER_*
#   docker compose up -d
#   docker compose logs -f beacon       # watch first post land
#
# Architecture: see README.md.

services:

  # ─────────────────────────────────────────────────────────────
  # Enshrouded dedicated server
  # Wine-based community image. The server's Windows binary +
  # SteamCMD live INSIDE the container; the host doesn't need
  # Wine installed.
  #
  # Pin to a specific image tag rather than `:latest` for the
  # dedicated server — game patches sometimes break the Wine
  # layer for a day or two. Tag-pinning gives you a known-good
  # baseline; bump manually after smoke-testing.
  #
  # Community-image docs: https://github.com/jsknnr/enshrouded-server
  # ─────────────────────────────────────────────────────────────
  enshrouded-server:
    image: sknnr/enshrouded-dedicated-server:latest
    container_name: enshrouded-server
    restart: unless-stopped
    ports:
      # UDP, all three needed for gameplay + Steam server-list
      # discovery. Open these on the host's firewall too (see
      # docs/port-forwarding.md).
      - "${GAME_PORT:-15636}:15636/udp"
      - "${QUERY_PORT:-15637}:15637/udp"
      - "15638:15638/udp"
    volumes:
      # All persistent server state lives under ./data/enshrouded.
      # The community image expects /home/steam/enshrouded as its
      # working tree (savegame/, logs/, enshrouded_server.json,
      # enshrouded_server_NNN.dat files all land here).
      - ./data/enshrouded:/home/steam/enshrouded
      # 0.44.4 ATTEMPT REVERTED in 0.44.5: tried to bind-mount
      # `enshrouded-install` named volume at
      # `/home/steam/Steam/steamapps/common/EnshroudedServer/`.
      # The sknnr image creates that directory as an EMPTY STUB
      # — SteamCMD's `force_install_dir` actually targets
      # `/home/steam/enshrouded/`, which we already bind-mount
      # from `./data/enshrouded/` (the line above). So the
      # named volume captured nothing. 0.44.5 drops the
      # named-volume mount and exposes the install dir to the
      # beacon via a sibling read-only bind mount on the
      # beacon's side instead (see beacon service below).
    environment:
      # Operator config — passed to the community image's
      # entrypoint which writes them into enshrouded_server.json.
      # Source values come from .env.
      - SERVER_NAME=${SERVER_NAME:-Enshrouded Server}
      - SERVER_PASSWORD=${SERVER_PASSWORD:-}
      - SERVER_SLOTS=${SERVER_SLOTS:-16}
      - GAME_PORT=15636
      - QUERY_PORT=15637
      # ── REQUIRED for "edit settings from the website" (0.90.0+) ──
      # By DEFAULT the sknnr image REGENERATES enshrouded_server.json
      # from the env vars above on EVERY container start. That would
      # silently CLOBBER any gameSettings the dashboard wrote the
      # moment the server restarts — defeating the feature.
      # `EXTERNAL_CONFIG=1` tells the image to PRESERVE the existing
      # enshrouded_server.json instead of regenerating it, so
      # dashboard edits survive a restart. Leave at 0 (default) if
      # you are NOT using the settings-editing feature.
      # See docs/server-settings.md for the full setup (this var +
      # a config-file chown + the beacon vars below).
      - EXTERNAL_CONFIG=${EXTERNAL_CONFIG:-0}
    # If your kernel allows, give the server a hint about which
    # CPUs to use. Default = all. Override via .env if you want
    # to reserve a core for other services.
    # cpuset: "0-3"

  # ─────────────────────────────────────────────────────────────
  # Beacon companion
  # Reads the dedicated server's save dir + logs (READ-ONLY)
  # plus a small writable volume for its log-tail-position
  # sidecar. Posts every 30s to your dashboard via HTTPS.
  #
  # Image is published by the source monorepo's CI:
  #   ghcr.io/spacetoast1738/enshrouded-beacon-server
  # Source: github.com/spacetoast1738/enshrouded-beacon
  # ─────────────────────────────────────────────────────────────
  beacon:
    image: ghcr.io/spacetoast1738/enshrouded-beacon-server:latest
    container_name: enshrouded-beacon
    restart: unless-stopped
    depends_on:
      - enshrouded-server
    volumes:
      # Save dir READ-ONLY — the beacon never modifies the
      # server's files.
      - ./data/enshrouded/savegame:/save:ro
      # Logs dir READ-ONLY for the same reason. The beacon
      # parses the log but never writes to it.
      - ./data/enshrouded/logs:/logs:ro
      # 0.44.3+: explicit bind-mount for the dedicated-server
      # config file (`enshrouded_server.json`). The parent-walk
      # auto-detect can't reach it because in the container the
      # parent of `/save` is just `/`, not the host's
      # `./data/enshrouded/`. With this file bind-mount plus
      # ESB_SERVER_CONFIG_PATH below, the beacon's routine
      # telemetry + diagnostic bundles both pick it up.
      #
      # READ-ONLY by default — the beacon never modifies the config.
      # To ENABLE "edit settings from the website" (0.90.0+): change
      # the `:ro` suffix below to `:rw`, set EXTERNAL_CONFIG=1 on the
      # server above, make the file beacon-writable
      # (`sudo chown 10100 data/enshrouded/enshrouded_server.json`),
      # and set ESB_ALLOW_SETTINGS_WRITE=1 below. Full walkthrough in
      # docs/server-settings.md.
      - ./data/enshrouded/enshrouded_server.json:/config/enshrouded_server.json:ro
      # Small writable volume for the beacon's saved-position
      # sidecar (so docker restart doesn't re-process the whole
      # log). 0.43.1+ uses the ESB_LOG_POS_PATH env to put this
      # OUTSIDE the read-only logs mount.
      - ./data/beacon-state:/state:rw
      # 0.44.5+: READ-ONLY view of the dedicated server's install
      # dir so the beacon can include the small catalog files
      # (enshrouded_server.kfc, readme, steam_appid.txt) in
      # diagnostic bundles per the source repo's
      # `client/dedicated_diagnostic_bundle.py::_INSTALL_DAT_ALLOWLIST`.
      # Same host path as `./data/enshrouded:/home/steam/enshrouded`
      # on the server container, but mounted read-only here.
      # The big content `.dat` files + `.kfc_resources` are
      # listed in the bundle's manifest but NOT included in
      # the tarball (each exceeds the 10 MB bundle cap).
      # The beacon NEVER writes to this mount.
      - ./data/enshrouded:/install:ro
    environment:
      - ESB_SAVE_DIR=/save
      - ESB_LOG_PATH=/logs/enshrouded_server.log
      - ESB_LOG_POS_PATH=/state/tail-pos.json
      # 0.44.3+: explicit pointer to the config file mount above.
      - ESB_SERVER_CONFIG_PATH=/config/enshrouded_server.json
      # Forward target — your existing dashboard host.
      - ESB_SERVER_URL=${DASHBOARD_URL}
      - ESB_TOKEN=${ESB_TOKEN}
      # Optional: display name shown in /admin → Dedicated
      # servers. Defaults to SERVER_NAME so the two stay in
      # sync without operator action.
      - ESB_DISPLAY_NAME=${SERVER_NAME:-Enshrouded Server}
      # 0.44.0+: opt-in for the dashboard's "Request diagnostic
      # bundle" flow. Default off (operator must explicitly
      # set ESB_ALLOW_DIAGNOSTIC_BUNDLES=1 in .env). See
      # `.env.example` for the full privacy note + what's in
      # a bundle.
      - ESB_ALLOW_DIAGNOSTIC_BUNDLES=${ESB_ALLOW_DIAGNOSTIC_BUNDLES:-0}
      # ── Edit settings from the website (0.90.0+) ──────────────
      # All OFF by default — the beacon stays read-only telemetry
      # unless you opt in. See docs/server-settings.md for the full
      # setup (these vars + EXTERNAL_CONFIG=1 + a config chown + the
      # `:rw` mount flip above).
      #
      # Let the dashboard WRITE edited gameSettings into
      # enshrouded_server.json. Requires the `:rw` mount flip + a
      # config-file chown to uid 10100. With this at 0, the dashboard
      # edit UI reports "refused".
      - ESB_ALLOW_SETTINGS_WRITE=${ESB_ALLOW_SETTINGS_WRITE:-0}
      # Let the dashboard RESTART the dedicated server so a config
      # write takes effect (Enshrouded only reads its config at
      # startup). Requires the docker-proxy service below (uncomment
      # it). With this at 0, a write lands and the dashboard reports
      # "restart pending" — you restart the server yourself.
      - ESB_ALLOW_SERVER_RESTART=${ESB_ALLOW_SERVER_RESTART:-0}
      # Container name of the dedicated server, as docker sees it
      # (matches `container_name: enshrouded-server` above).
      - ESB_SERVER_CONTAINER_NAME=${ESB_SERVER_CONTAINER_NAME:-enshrouded-server}
      # Hardened docker-socket-proxy endpoint (the beacon talks ONLY
      # to this, never the raw docker socket). Matches the service
      # name below.
      - ESB_DOCKER_PROXY_URL=${ESB_DOCKER_PROXY_URL:-http://docker-proxy:2375}
      # Optional cadences (defaults shown):
      # - ESB_POLL_INTERVAL_SEC=30
      # - ESB_HEARTBEAT_INTERVAL_SEC=60
      #
      # Pre-0.59.2 the heartbeat default was 300s (5 min); lowered
      # to 60s so the dashboard's "beacon Xs ago" timestamp stays
      # fresh on quiet servers. Override here only if your
      # bandwidth budget is constrained — 1 post/min is still
      # negligible (~0.3% of the per-token rate-limit budget).

  # ─────────────────────────────────────────────────────────────
  # Dashboard web hub  (OPT-IN — co-located all-in-one deploy)
  # Disabled by default — this stack normally forwards to a SEPARATE
  # dashboard host. Enable ONLY if you want to run the dashboard ON
  # THIS host, next to the game server + companion, so distant
  # players hit this box (a datacenter VPS) instead of your home
  # uplink — and the companion→dashboard hop collapses to localhost
  # (no Cloudflare round-trip on /ingest OR /ingest/vitals).
  #
  # Start with:  docker compose --profile dashboard up -d
  # When enabled, set in .env:
  #   DASHBOARD_URL=http://dashboard:8000   (companion posts here over
  #                                          the compose network)
  #   DASHBOARD_PUBLIC_URL=https://your.domain   (public hostname)
  #   plus RESEND_* / VITALS_TICKET_SECRET / CLOUDFLARED_TOKEN (.env).
  #
  # This is the DASHBOARD image (ghcr.io/.../enshrouded-beacon),
  # distinct from the `beacon` companion image above. Full migration
  # walkthrough (incl. moving your existing SQLite DB here):
  #   docs/co-located-dashboard.md
  # ─────────────────────────────────────────────────────────────
  dashboard:
    image: ghcr.io/spacetoast1738/enshrouded-beacon:latest
    container_name: enshrouded-dashboard
    restart: unless-stopped
    profiles: ["dashboard"]
    # Loopback-only publish for local smoke-tests
    # (`curl localhost:8000/healthz`). cloudflared reaches the
    # dashboard by service name over the compose network, so NOTHING
    # is exposed on the host's public interface here. Don't open 8000
    # in the host firewall.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # SQLite system-of-record DB + logs. Migrate your existing
      # dashboard.db into ./data/dashboard/ first — see
      # docs/co-located-dashboard.md (stop-writer + checkpoint +
      # integrity_check). The container's `app` user (uid 1000) owns
      # /data; the entrypoint chowns it on boot.
      - ./data/dashboard:/data
    environment:
      - DATABASE_PATH=/data/dashboard.db
      # Behind the Cloudflare tunnel TLS terminates at the edge →
      # keep browser cookies Secure.
      - COOKIE_SECURE=1
      # Public URL friends use (magic-link sign-in emails embed it).
      # Keep this the SAME hostname you used at the home box so the
      # move is invisible to friends.
      - PUBLIC_BASE_URL=${DASHBOARD_PUBLIC_URL}
      # Magic-link auth email (Resend). Needed for sign-in.
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM=${RESEND_FROM:-}
      # Optional GitHub token for the /releases proxy (player-Beacon
      # auto-update). Empty = that endpoint returns 503; harmless.
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # MUST equal the companion's ESB_VITALS_TICKET_SECRET if you use
      # the 0.106.0 direct-vitals overlay path. Empty disables it
      # (overlays fall back to hub-SSE). See docs/co-located-dashboard.md.
      - VITALS_TICKET_SECRET=${VITALS_TICKET_SECRET:-}
    # The image runs unprivileged with a read-only root + tmpfs for
    # scratch; /data is the only writable path. Matches the source
    # repo's hardened compose.
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.cache

  # ─────────────────────────────────────────────────────────────
  # Cloudflare Tunnel  (OPT-IN — pairs with the dashboard above)
  # Disabled by default. Exposes the co-located dashboard at your
  # public hostname via an OUTBOUND tunnel — cloudflared dials
  # Cloudflare's edge, so NO inbound port is opened on the VPS
  # firewall (same security posture as the home deployment). It
  # reaches the dashboard by service name (http://dashboard:8000)
  # over the compose network.
  #
  # Setup: create a tunnel in Cloudflare Zero Trust → Networks →
  # Tunnels, add a Public Hostname routing your domain →
  # http://dashboard:8000, copy the tunnel TOKEN into
  # CLOUDFLARED_TOKEN in .env. Walkthrough: docs/co-located-dashboard.md.
  # ─────────────────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: enshrouded-cloudflared
    restart: unless-stopped
    profiles: ["dashboard"]
    depends_on:
      - dashboard
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TOKEN}

  # ─────────────────────────────────────────────────────────────
  # Docker socket proxy  (OPT-IN — only for "restart from website")
  # Disabled by default. Uncomment this whole service ONLY if you
  # set ESB_ALLOW_SERVER_RESTART=1 above, so the dashboard can
  # restart the dedicated server after a settings write.
  #
  # It exposes a HARDENED, read-mostly slice of the docker API —
  # CONTAINERS=1 + POST=1 only, everything else denied — so the
  # beacon can issue `POST /containers/enshrouded-server/restart`
  # but NOT exec/build/pull/inspect-secrets. Same pattern Watchtower
  # already uses, but scoped. The beacon never touches the raw
  # /var/run/docker.sock; only this proxy does (read-only mount).
  #
  # Residual: the proxy can't scope POST to a SINGLE container, so
  # with the gate on, the beacon could restart (only restart) any
  # container the proxy sees. Mitigations: the default-off gate +
  # the operation allow-list. See docs/server-settings.md.
  # ─────────────────────────────────────────────────────────────
  # docker-proxy:
  #   image: tecnativa/docker-socket-proxy:latest
  #   container_name: enshrouded-docker-proxy
  #   restart: unless-stopped
  #   environment:
  #     - CONTAINERS=1
  #     - POST=1
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro

  # ─────────────────────────────────────────────────────────────
  # Watchtower
  # Auto-updates the `enshrouded-server` + `beacon` images by
  # polling :latest tags every 5 minutes. Comment out this
  # service if you'd rather pin image tags + upgrade manually.
  #
  # `--cleanup` removes old image layers post-pull (saves disk).
  # `--label-enable` would let you opt specific containers in;
  # we don't use it here so both auto-update.
  #
  # NOTE on image choice (2026-05-15+): we use `nickfedor/watchtower`
  # — the maintained fork of `containrrr/watchtower`. The original
  # `containrrr/watchtower:latest` bundles an old Docker API client
  # (1.25) that fails against any host running Docker Engine 25+
  # with:
  #   client version 1.25 is too old. Minimum supported API
  #   version is 1.44
  # The fork ships a current docker client lib + active maintenance.
  # Operators upgrading from the previous compose file just:
  #   docker compose pull watchtower
  #   docker compose up -d watchtower
  # ─────────────────────────────────────────────────────────────
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: enshrouded-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup
    environment:
      - TZ=${TZ:-UTC}

# No top-level networks block — services share Docker's default
# `bridge` network for the compose project, which is fine for the
# beacon → dashboard (HTTPS, leaves the host) + game-server →
# Steam (UDP, leaves the host) traffic.

# 0.44.5: the `enshrouded-install` named volume from 0.44.4
# is removed — it was mounted on the wrong path (sknnr image
# installs to `/home/steam/enshrouded`, NOT
# `.../Steam/steamapps/common/EnshroudedServer/`). The
# beacon's `/install:ro` mount now reads from the same host
# path as the server's main volume.
#
# Operators upgrading from 0.44.4: after `docker compose up
# -d`, you may have an orphan `enshrouded-install` named
# volume. Clean up with `docker volume rm enshrouded-beacon-
# server-stack_enshrouded-install` (the project prefix
# matches the directory name).
